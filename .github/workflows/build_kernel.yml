name: Build Android Kernel with NDK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: android-ndk-r29
          key: ${{ runner.os }}-ndk-r29

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-build-${{ hashFiles('**/Makefile', '**/Kconfig*') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio libncurses5-dev libssl-dev lz4
          if [ ! -d "android-ndk-r29" ]; then
            wget https://dl.google.com/android/repository/android-ndk-r29-linux.zip
            unzip android-ndk-r29-linux.zip
          fi
          echo "NDK_HOME=$PWD/android-ndk-r29" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Add KernelSU
        run: |
          chmod +x ksu.sh
          ./ksu.sh
          
      - name: Build Kernel
        run: |
          make O=build LLVM=1 \
            ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            -j$(nproc --all)


      - name: Move Kernel
        run: |
          cp build/arch/arm64/boot/Image build/AnyKernel

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel-ReSukisSu
          path: build/AnyKernel